#docker-compose.yml

version: "3"
services:
    python_service:
          build:
            context:
            dockerfile: dockerfile.python
            args:
                - BASE_IMAGE=python:3.9
                - APP_VERSION=2.0
          environemnt:
            - DEBUG=true
          image: punksoul2580/python_web2.0

node_service:
  build:  
    context:
    dockerfile: docker.node
    args:
      - BASE_IMAGE=node:21
      - APP_NAME=my-nodejs-app
    environment:
      - NODE_ENV=development
    image: punksoul2580/node_web:2.0