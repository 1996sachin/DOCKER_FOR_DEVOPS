version: '3'

services:
#My SQL services
db:
  images: mysql:5.7
  container-name: mysql-container
  restart: always
  environment:
    MYSQL_ROOT_PASSWORD: mypassword
    MYSQL_DATABASE: wordpress
    MYSQL_USERS: wordpressuser
    MYSQL_PASSWORD: wordpress
  volumes: 
    - mysql_data:/var/lib/mysql
  networks:
    - wordpress_networks
  ports:
    - "3306:3306"

#Wordpress servcie
wordpress:
  depends_on:
    -db 
  image: wordpress:latest
  container_name: wordpress-container
  restart: always
  environment:
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_USER: wordpressuser
    WORDPRESS_DB_PASSWORD: wordpress
  volumes:
    - wordpress_data:/var/www/html
  ports:
    - "8080:80"
  networks:
    wordpress_networks

volumes:
  mysql_data:
  wordpress_data:

networks:
  wordpress_networks:
    driver: bridge
